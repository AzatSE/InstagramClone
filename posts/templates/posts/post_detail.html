{% extends 'posts/base.html' %}
{% block content %}

<a href="{% url 'profile' %}" class="d-inline-block mb-3 text-decoration-none">&larr; Назад в профиль</a>

<div class="card shadow-sm">
    <div class="card-header bg-white fw-bold">{{ post.author.username }}</div>
    <div class="post-img-wrapper">
        <img src="{{ post.image.url }}" class="card-img-top post-image" data-post-id="{{ post.id }}">
        <div class="like-animation" id="like-anim-{{ post.id }}"><i class="bi bi-heart-fill"></i></div>
    </div>
    <div class="card-body">
        <div class="action-icons">
            <div class="action-icons-left">
                <button class="icon-btn like-btn {% if user in post.likes.all %}liked{% endif %}" data-post-id="{{ post.id }}">
                    <i class="bi {% if user in post.likes.all %}bi-heart-fill{% else %}bi-heart{% endif %}"></i>
                </button>
                <button class="icon-btn" title="Комментировать"><i class="bi bi-chat"></i></button>
                <button class="icon-btn" title="Поделиться"><i class="bi bi-send"></i></button>
            </div>
            <button class="icon-btn" title="Сохранить"><i class="bi bi-bookmark"></i></button>
        </div>
        <div><b><span class="likes-count" id="likes-{{ post.id }}">{{ post.total_likes }}</span> лайков</b></div>
        <p class="mt-2 mb-0"><b>{{ post.author.username }}</b> {{ post.caption }}</p>
    </div>
</div>

<script>
async function likePost(postId, likeOnly) {
    const likeBtn = document.querySelector(`.like-btn[data-post-id="${postId}"]`);
    if (!likeBtn) return;
    if (likeOnly && likeBtn.classList.contains('liked')) return; // уже лайкнуто — двойной клик ничего не делает

    const res = await fetch(`/like/${postId}/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': '{{ csrf_token }}' }
    });
    const data = await res.json();
    const icon = likeBtn.querySelector('i');
    icon.classList.toggle('bi-heart', !data.liked);
    icon.classList.toggle('bi-heart-fill', data.liked);
    likeBtn.classList.toggle('liked', data.liked);
    document.getElementById(`likes-${postId}`).textContent = data.total_likes;
}

function showLikeAnimation(postId) {
    const el = document.getElementById(`like-anim-${postId}`);
    if (!el) return;
    el.classList.remove('show');
    void el.offsetWidth; // перезапуск CSS-анимации
    el.classList.add('show');
}

document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', () => likePost(btn.dataset.postId, false));
});

document.querySelectorAll('.post-image').forEach(img => {
    img.addEventListener('dblclick', () => {
        const postId = img.dataset.postId;
        showLikeAnimation(postId);
        likePost(postId, true);
    });
});
</script>
{% endblock %}
